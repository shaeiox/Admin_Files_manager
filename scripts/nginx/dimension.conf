# scripts/nginx/dimension.conf - TLS-terminating reverse proxy for Dimension.
# Install: sudo install -m 0644 scripts/nginx/dimension.conf /etc/nginx/sites-available/dimension.conf
#          sudo ln -s ../sites-available/dimension.conf /etc/nginx/sites-enabled/dimension.conf
#          sudo nginx -t && sudo systemctl reload nginx        # validate BEFORE applying
# Replace files.example.internal and the certificate paths for the host.
# (production-cicd-readiness D5, D6; docs/DEPLOYMENT.md)
#
# THE API IS UNAUTHENTICATED (ADR-003). This proxy encrypts transport; it does not
# make the service safe to expose publicly. Keep it on a trusted network until
# authentication lands.

upstream dimension_app {
    # The app binds every interface (no host argument to app.listen); the host
    # firewall keeps port 3000 off the network, and the proxy talks to loopback.
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name files.example.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name files.example.internal;

    ssl_certificate     /etc/ssl/dimension/fullchain.pem;
    ssl_certificate_key /etc/ssl/dimension/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Body ceiling ABOVE the application's limit (UPLOAD_MAX_BYTES, default 5 GiB) so
    # the application - not the proxy - decides acceptance, and raising the app limit
    # is not silently defeated here (D6). Raise this too if UPLOAD_MAX_BYTES >= 6g.
    client_max_body_size 6g;

    # Stream request bodies straight to the app: it already stages uploads inside
    # STORAGE_ROOT; a second full copy in proxy temp storage is a bottleneck (D6).
    proxy_request_buffering off;
    # Stream responses (file downloads, ZIP archives) instead of spooling them.
    proxy_buffering off;

    # Longer than any legitimate request and than the app's 30 s shutdown grace (D5).
    client_body_timeout 600s;
    proxy_send_timeout  600s;
    proxy_read_timeout  600s;
    proxy_connect_timeout 10s;

    location / {
        # Everything goes to the application, including unknown paths: server.js
        # owns the SPA fallback and the /api JSON 404s. No try_files, no shell here.
        proxy_pass http://dimension_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }
}
