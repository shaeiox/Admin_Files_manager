# scripts/nginx/cloudavid.conf - CloudAvid: both domains, one host.
#
#   files.cloudavid.com       -> portal: static shell from /var/www/html/files-server-web/public,
#                                 /api/ + /release{8,9}/latest proxied to 127.0.0.1:4000
#                                 (the portal Node process; it enforces admin policies)
#   adminfiles.cloudavid.com  -> REVERSE PROXY:  127.0.0.1:3000, the Dimension app
#                                 running from /var/www/html/Admin-Files
#
# Full install, certificate and verification instructions: scripts/nginx/README.md.
# Short form:
#   sudo install -m 0644 scripts/nginx/cloudavid.conf /etc/nginx/sites-available/cloudavid.conf
#   sudo ln -sf ../sites-available/cloudavid.conf /etc/nginx/sites-enabled/cloudavid.conf
#   sudo nginx -t && sudo systemctl reload nginx     # ALWAYS validate before reloading
#
# TWO PREREQUISITES, or the admin vhost fails on first contact:
#   1. The basic-auth file must exist (create it BEFORE the first request):
#        printf '%s:%s\n' '<user>' "$(openssl passwd -apr1)" \
#          | sudo tee /etc/nginx/cloudavid-admin.htpasswd
#      (a missing auth_basic_user_file makes nginx answer 500 to every admin request)
#   2. The certificate must cover BOTH names. A cert issued for
#      files.cloudavid.com alone fails the handshake on adminfiles.cloudavid.com.
#      Check: openssl x509 -in <cert> -noout -ext subjectAltName
#
# WARNING - THE ADMIN API IS UNAUTHENTICATED (ADR-003). The application behind
# this proxy has no login of its own: anyone who reaches it can list, download,
# upload and delete files in STORAGE_ROOT. auth_basic below is the ONLY gate.
# Do not remove it until real authentication lands in the app. TLS encrypts the
# wire; it authenticates nobody.

# ==============================================================================
# 0. Host-name hash (http level, applies while this file is loaded)
#
# Both names share ports 80 and 443, so nginx builds ONE virtual-server-name
# hash for them. files.cloudavid.com + adminfiles.cloudavid.com collide in
# that hash and do not fit nginx's default 32-byte bucket: the start-up check
# then fails with "could not build server_names_hash, you should increase
# server_names_hash_bucket_size: 32". The value is deterministic (the hash is
# plain byte arithmetic), so this is not a platform quirk - keep this line.
# 128 leaves room for future names; it only sizes an in-memory table.
# ==============================================================================
server_names_hash_bucket_size 128;

# ==============================================================================
# 1. HTTP -> HTTPS (both names)
# ==============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name files.cloudavid.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name adminfiles.cloudavid.com;
    return 301 https://$host$request_uri;
}

# ==============================================================================
# 2. PORTAL - files.cloudavid.com - static files only
# ==============================================================================
server {
    # nginx >= 1.25.1 deprecates the `http2` listen parameter (it still works,
    # but prints a warning). There, replace both lines with:
    #   listen 443 ssl;
    #   listen [::]:443 ssl;
    #   http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name files.cloudavid.com;

    root /var/www/html/files-server-web/public;
    index index.html;
    server_tokens off;

    # --------------------------------------------------------------------------
    # TLS
    # --------------------------------------------------------------------------
    ssl_certificate         /etc/ssl/certs-web/fullchain-new.pem;
    ssl_certificate_key     /etc/ssl/certs-web/private.key;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    # ECDHE + AEAD-GCM only. The DHE variants were dropped: without an explicit
    # ssl_dhparam nginx falls back to weak DH parameters, and forward secrecy is
    # already provided by ECDHE. Add ssl_dhparam first if you ever re-add DHE.
    ssl_ciphers             "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    ssl_session_cache       shared:SSL:50m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # --------------------------------------------------------------------------
    # Security headers (portal)
    #
    # INHERITANCE RULE (nginx): a location that declares ANY add_header of its
    # own does NOT inherit these - the whole set is dropped, not merged. Every
    # location below that sets a cache header therefore repeats the full set.
    # If you add add_header anywhere here and forget this, that response ships
    # with no HSTS and no framing protection.
    # --------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Content API - the portal Node process (files-server-web, PORT=4000)
    #
    # ALL file content (listings, downloads, hashes, ZIP, search, releases) goes
    # through the portal process: it is the only place Admin Files Manager
    # policies (locked / unpublished / deny / grants) are enforced. NEVER serve
    # FILES_ROOT from disk here (no root/alias/autoindex on the content dir) -
    # that bypasses every policy and publishes locked files to anyone.
    #
    # Covers /api/* and the curl "latest release" shortcuts /release8|9/latest.
    # ORDER IS LOAD-BEARING: this regex must stay ABOVE the extension regexes
    # (html/css/js/images) and the deny rules - nginx takes the first matching
    # regex, so below them /api/download/x.js or a.png would 404 from disk.
    # --------------------------------------------------------------------------
    location ~ ^/(?:api/|release[89]/latest$) {
        # Must match the portal's PORT. Edit HERE if it runs elsewhere.
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        # $remote_addr, NOT $proxy_add_x_forwarded_for: the portal rate limiter
        # keys on this header verbatim, so a client-supplied value must not
        # survive into it.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        # The portal refuses CLI Basic credentials unless this says https.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large artifact downloads and ZIP streams: no proxy buffering.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        # No add_header here: the server-level security set is inherited, and
        # the app sets its own Cache-Control on API responses.
    }

    # --------------------------------------------------------------------------
    # Frontend cache strategy
    #
    # The root is the checkout's public/ directory: server.js, lib/, data/,
    # package.json and docs/ sit one level up and are unreachable by
    # construction. The allowlist below is a second line: only the three HTML
    # shells and /assets/ are served; any other path gets the SPA shell. (The
    # old root was the checkout itself, and extension rules published
    # /server.js, /lib/*.js, /package.json and /data/users.json.)
    # --------------------------------------------------------------------------
    # A) HTML - NEVER cache. Browser revalidates index.html on every navigation,
    #    so a deploy is visible on the next reload. One Cache-Control only:
    #    `expires -1` would emit a second, conflicting one alongside add_header.
    #    The CSP mirrors the portal's (lib/http-utils.js securityHeaders): these
    #    shells are served by nginx, so Node never gets to set it.
    location ~ ^/(?:index|browse|404)\.html$ {
        root /var/www/html/files-server-web/public;
        try_files $uri =404;

        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # B) JS & CSS - ETag revalidation. 304 if unchanged, 200 + new bytes when the
    #    file changed (content-addressed or not, this one is always correct).
    location ~* ^/assets/.+\.(?:css|js)$ {
        root /var/www/html/files-server-web/public;
        etag on;
        try_files $uri =404;

        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        access_log off;
    }

    # C) Images, fonts, media - long cache (7 days).
    #    Still has the full security header set: `expires 7d` + add_header would
    #    double up Cache-Control, and add_header alone used to wipe the headers
    #    inherited from server level - image responses shipped with no HSTS.
    location ~* ^/assets/.+\.(?:png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|mp4|webm)$ {
        root /var/www/html/files-server-web/public;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=604800, no-transform" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        access_log off;
    }

    # --------------------------------------------------------------------------
    # Main application route = SPA shell. No try_files $uri: nothing outside the
    # allowlist above is ever read from disk.
    # `last` re-enters location matching as /index.html, which the html block
    # above serves with no-store, CSP and the full security set. No add_header
    # needed here - and adding one would only risk the inheritance rule.
    # --------------------------------------------------------------------------
    location / {
        rewrite ^ /index.html last;
    }

    # --------------------------------------------------------------------------
    # Deny rules - portal root only (content is never served from disk here).
    # `return` runs in the rewrite phase, BEFORE `deny` would run in the access
    # phase, so a `deny all` next to these returns would be dead code.
    # --------------------------------------------------------------------------
    location ~ /\. {
        return 404;
        access_log off;
        log_not_found off;
    }

    location ~ \.(?:php|pl|py|cgi)$ {
        return 404;
    }

    location ~* \.(?:backup|bak|sql|env|log)$ {
        return 404;
    }
}

# ==============================================================================
# 3. ADMIN - adminfiles.cloudavid.com - REVERSE PROXY, not a document root
#
# /var/www/html/Admin-Files holds the Express application (server.js), not a
# built site: nginx cannot serve it as files - /api, uploads, downloads and the
# SPA fallback all live in the process. Everything is proxied to it below.
# ==============================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name adminfiles.cloudavid.com;

    server_tokens off;

    ssl_certificate         /etc/ssl/certs-web/fullchain-new.pem;
    ssl_certificate_key     /etc/ssl/certs-web/private.key;

    ssl_protocols           TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers             "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384";

    ssl_session_cache       shared:SSL:50m;
    ssl_session_timeout     1d;
    ssl_session_tickets     off;

    # --------------------------------------------------------------------------
    # The gate. The app has no login (ADR-003); this is the only thing between
    # the internet and full read/write access to STORAGE_ROOT. A missing
    # htpasswd file here makes nginx answer 500 to EVERY request - create it
    # before reloading (see the header of this file).
    # No add_header is declared in this server block ON PURPOSE: the security
    # headers arrive from the application (helmet) through the proxy, and
    # declaring them here would duplicate them.
    # --------------------------------------------------------------------------
    auth_basic           "CloudAvid Admin";
    auth_basic_user_file /etc/nginx/cloudavid-admin.htpasswd;

    # --------------------------------------------------------------------------
    # Body ceiling and timeouts, in step with the application
    # (docs/DEPLOYMENT.md)
    # --------------------------------------------------------------------------
    # ABOVE the application's UPLOAD_MAX_BYTES (5 GiB default) so the app - not
    # the proxy - decides acceptance, and raising the app limit is not silently
    # defeated here. Raise both together if UPLOAD_MAX_BYTES >= 6g.
    client_max_body_size 0;

    # Stream bodies both ways: uploads are staged inside STORAGE_ROOT by the
    # app (a second full copy in proxy temp storage is a bottleneck), and
    # responses are file downloads and ZIP archives.
    proxy_request_buffering off;
    proxy_buffering off;

    # Longer than any legitimate request and than the app's 30 s shutdown grace.
    client_body_timeout 24h;
    proxy_send_timeout  24h;
    proxy_read_timeout  24h;
    proxy_connect_timeout 60s;
    
    # Keep client connections alive
    keepalive_timeout 75s;

    location / {
        # Must match PORT (default 3000). If the app runs elsewhere, edit HERE
        # and nowhere else.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
    }

    # No try_files / SPA fallback: server.js owns the fallback (it serves
    # public/index.html for unknown GETs) and /api 404s as JSON.
    #
    # EXACTLY ONE PROXY HOP: server.js sets `trust proxy` to 1 so rate limiting
    # keys on the address nginx reports. Inserting another proxy in front of
    # this one silently mis-keys rate limiting and client IPs (ADR-008).
}
